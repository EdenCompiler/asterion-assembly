name: build-and-test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y sbcl libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev zip curl ffmpeg xvfb xdotool imagemagick librsvg2-bin openbox
      - run: curl -O https://beta.quicklisp.org/quicklisp.lisp && sbcl --non-interactive --load quicklisp.lisp --eval '(quicklisp-quickstart:install)' --eval '(ql:quickload :sdl2)'
      - run: make test
      - run: make playtest
      - run: make smoke-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-smoke-evidence
          path: |
            build/package-smoke/**/*.log
            build/package-smoke/**/*.ppm
            build/package-smoke/**/*.save
      - uses: actions/upload-artifact@v4
        with:
          name: asterion-assembly-linux-x64
          path: dist/asterion-assembly-linux-x64.zip

  build-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: crazy-max/ghaction-chocolatey@v3
        with:
          args: install sbcl -y
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-SDL2_image
            mingw-w64-x86_64-SDL2_mixer
      - shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:SDL_BIN=Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          if (!(Test-Path "$env:SDL_BIN\SDL2.dll")) {
            throw "SDL2.dll não foi encontrado em $env:SDL_BIN."
          }
          $env:PATH="$env:SDL_BIN;$env:PATH"
          Invoke-WebRequest https://beta.quicklisp.org/quicklisp.lisp -OutFile quicklisp.lisp
          sbcl --non-interactive --load quicklisp.lisp --eval '(quicklisp-quickstart:install)'
          if ($LASTEXITCODE -ne 0) { throw 'Quicklisp installation failed' }
          sbcl --script tests/portable-circuit-tests.lisp
          if ($LASTEXITCODE -ne 0) { throw 'Portable circuit/tutorial tests failed' }
          ./scripts/build-windows.ps1
      # Driver OpenGL somente no runner: o ZIP do jogador já foi criado.
      - shell: msys2 {0}
        run: pacman --noconfirm -S mingw-w64-x86_64-mesa
      - shell: powershell
        env:
          MSYS2_LOCATION: ${{ steps.msys2.outputs.msys2-location }}
        run: |
          $env:ASTERION_CI_OPENGL_DIR=Join-Path $env:MSYS2_LOCATION "mingw64\bin"
          ./tests/windows-opengl-probe.ps1
          ./tests/package-smoke.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-smoke-evidence
          path: |
            build/windows-smoke/**/*.log
            build/windows-smoke/**/*.err
            build/windows-smoke/**/*.ppm
            build/windows-smoke/**/*.save
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: asterion-assembly-windows-x64
          path: dist/asterion-assembly-windows-x64.zip

  compare-native-state:
    needs: [test-linux, build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-smoke-evidence'
          path: evidence
      - name: Compare Linux and Windows simulation hashes
        shell: bash
        run: |
          LinuxHash="$(sed -n 's/^CIRCUIT SMOKE OK: .*state \([0-9A-F]*\).*$/\1/p' evidence/linux-smoke-evidence/AsterionAssembly-linux-x64/headless.log)"
          WindowsHash="$(sed -n 's/^CIRCUIT SMOKE OK: .*state \([0-9A-F]*\).*$/\1/p' evidence/windows-smoke-evidence/AsterionAssembly-windows-x64/headless.log)"
          test -n "$LinuxHash"
          test "$LinuxHash" = "$WindowsHash"
          echo "Native deterministic state: $LinuxHash"
